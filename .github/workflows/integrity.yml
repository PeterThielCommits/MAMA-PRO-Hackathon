name: Integrity and build checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit (SCA via npm audit)
        run: npm audit --audit-level=high
      - name: TypeScript, unit tests, and phase evidence audit
        run: npm run check
      - name: Production static build (DEMO only)
        run: npm run build
      - name: Install locked Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (dev, release, pilot and offline)
        run: |
          npm run test:e2e -- --workers=2
          npm run check:release -- --workers=2
          npx playwright test --config playwright.pilot.config.ts
          npx playwright test --config playwright.offline.config.ts
